<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>La mitad de mi vida — clip</title>
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <style>
      @font-face { font-family: "Brush"; src: url("fonts/BRUSHSCI.TTF") format("truetype"); }
      @font-face { font-family: "Impact2"; src: url("fonts/impact.ttf") format("truetype"); }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #fx-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

      /* Warhol: 3x2 celdas, fondo de color + silueta de color + tinta */
      .wh { position: absolute; inset: 0; opacity: 0; }
      .cell { position: absolute; width: 640px; height: 540px; overflow: hidden; display: block; }
      .cell .sil, .cell .ink { position: absolute; left: 176px; top: 20px; width: 287px; height: 520px; display: block; }
      .cell .sil { -webkit-mask-image: url("images/sil.png"); -webkit-mask-size: 100% 100%; mask-image: url("images/sil.png"); mask-size: 100% 100%; }
      .cell.flip .sil, .cell.flip .ink { transform: scaleX(-1); }

      /* TIKO gigante */
      .tk-wrap { position: absolute; left: -200px; top: -120px; width: 2320px; height: 1320px; opacity: 0; transform: rotate(-7deg); }
      .tk-row { position: absolute; left: 0; height: 330px; white-space: nowrap; display: block;
        font-family: "Impact2"; font-size: 300px; line-height: 330px; letter-spacing: 0.02em; }

      /* Logo */
      .logo { position: absolute; display: flex; flex-direction: column; align-items: center; opacity: 0; }
      .logo .tk { display: block; font-family: "Brush"; color: #ffe08a; line-height: 0.9; -webkit-text-stroke: 4px #4a0030; }
      .logo .dn { display: block; font-family: "Impact2"; color: #fff; letter-spacing: 0.12em; line-height: 1; -webkit-text-stroke: 4px #1a0040; }
      #logo { left: 460px; top: 260px; width: 1000px; }
      #logo .tk { font-size: 280px; } #logo .dn { font-size: 220px; }
      #photo { position: absolute; left: 1100px; top: 140px; width: 780px; display: block; opacity: 0; }

      /* Acentos de letra: pequeños, arriba, secundarios */
      .lyr { position: absolute; left: 0; top: 70px; width: 1920px; display: flex; justify-content: center; opacity: 0; }
      .lyr span { display: block; white-space: nowrap; }
      .lyr.k span { font-family: "Impact2"; font-size: 92px; color: #fff; text-transform: uppercase; transform: skewX(-9deg);
        -webkit-text-stroke: 3px #1c0418; letter-spacing: 0.02em; }
      .lyr.hero span { font-family: "Brush"; font-size: 140px; color: #fff4d6; -webkit-text-stroke: 3px #4a0030; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="__DURATION__">
      <section id="fx" class="clip layer" data-start="0" data-duration="__DURATION__" data-track-index="1">
        <canvas id="fx-layer" width="1920" height="1080"></canvas>
      </section>
      <section id="overlays" class="clip layer" data-start="0" data-duration="__DURATION__" data-track-index="2">
__OVERLAYS__
      </section>
    </div>

    <script>
      window.SHOW = __SHOW__;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, window.SHOW.duration);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      const SH = window.SHOW;
      const canvas = document.getElementById("fx-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
      renderer.setSize(1920, 1080, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const V3 = () => new THREE.Vector3();
      const U = {
        uRes: { value: new THREE.Vector2(1920, 1080) }, uT: { value: 0 }, uPh: { value: 0 },
        uLo: { value: 0 }, uHi: { value: 0 }, uB: { value: new Array(16).fill(0) },
        uY: { value: V3() }, uInk: { value: V3() },
        uSA: { value: 1 }, uPA: { value: V3() }, uEA: { value: 1 }, uTA: { value: 0 },
        uSB: { value: 1 }, uPB: { value: V3() }, uEB: { value: 1 }, uTB: { value: 0 },
        uMix: { value: 1 }, uFrame: { value: 0 },
      };
      const frag = `
        precision highp float;
        uniform vec2 uRes; uniform float uT, uPh, uLo, uHi, uMix, uFrame;
        uniform float uB[16];
        uniform vec3 uY, uInk;
        uniform float uSA, uEA, uTA, uSB, uEB, uTB;
        uniform vec3 uPA, uPB;
        varying vec2 vUv;
        #define PI 3.14159265
        #define TAU 6.2831853
        float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
        float fbm(float x){ return noise(vec2(x, 1.7))*0.6 + noise(vec2(x*2.3, 5.1))*0.3 + noise(vec2(x*5.1, 9.3))*0.1; }
        mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
        float band(float j){ float v = 0.0; for (int k = 0; k < 16; k++) { if (float(k) == j) v = uB[k]; } return v; }
        // latido suave: 1 en el beat, cae en el resto
        float beatK(float ph){ return exp(-fract(ph)*3.5); }
        vec3 W = vec3(1.0);

        // 1 — Sol gigante con rayos
        vec3 sSol(vec2 p, vec3 P, float e, float ph, float t){
          float seg = floor(ph/16.0);
          vec2 c = vec2(0.0, -0.04);
          float r = length(p-c), a = atan(p.y-c.y, p.x-c.x);
          vec3 bg = mix(mix(P, uY, 0.55), P, smoothstep(-0.55, 0.45, p.y));
          float n = 14.0 + 4.0*mod(seg, 2.0);
          float dir = mod(seg, 2.0) < 1.0 ? 1.0 : -1.0;
          float w = 0.5 + 0.5*cos(a*n + dir*ph*0.55*e);
          float ray = smoothstep(0.45, 0.55, w) * smoothstep(1.4, 0.15, r);
          vec3 col = mix(bg, mix(bg, uY*1.05, 0.65), ray);
          float b = beatK(ph);
          float R = 0.21 + 0.012*b*e;
          float ripple = fract(ph*0.5);
          col += uY * exp(-pow((r - (R + ripple*0.9))/0.012, 2.0)) * (1.0-ripple) * 0.35;
          col += uY * exp(-max(r-R, 0.0)*7.0) * 0.55;
          col = mix(col, mix(uY, W, 0.35), smoothstep(R+0.004, R-0.004, r));
          return col;
        }
        // 2 — Túnel de anillos
        vec3 sTunel(vec2 p, vec3 P, float e, float ph, float t){
          float seg = floor(ph/16.0);
          p *= rot(0.15*sin(ph*PI/16.0));
          float a = atan(p.y, p.x) + ph*0.06*e*(mod(seg,2.0)<1.0?1.0:-1.0);
          float sides = mod(seg, 3.0) < 1.0 ? 6.0 : (mod(seg,3.0) < 2.0 ? 4.0 : 8.0);
          float k = PI/sides;
          float hr = mod(seg, 3.0) > 1.5 ? length(p) * cos(k) / cos(mod(a, 2.0*k) - k) : length(p) * cos(mod(a, 2.0*k) - k) / cos(k);
          float z = 1.1/max(hr, 0.002) + ph*0.5*e;
          float idx = floor(z), f = fract(z);
          vec3 c1 = mod(idx, 2.0) < 1.0 ? P : uY;
          if (mod(idx, 6.0) > 4.5) c1 = W;
          float edge = smoothstep(0.0, 0.06, f) * smoothstep(1.0, 0.94, f);
          vec3 col = mix(uInk, c1, edge);
          float depth = smoothstep(0.0, 0.1, hr);
          col = mix(mix(uY, W, 0.5), col, depth);
          col *= 0.7 + 0.3*smoothstep(0.0, 0.8, hr) + 0.12*beatK(ph);
          return col;
        }
        // 3 — Acordeón: fuelle que respira al compás
        vec3 sAcordeon(vec2 p, vec3 P, float e, float ph, float t){
          float breath = 0.5 - 0.5*cos(ph*PI/4.0);
          float W0 = 0.42 + 0.16*breath;
          vec2 g = p*7.0; vec2 gi = floor(g), gf = fract(g) - 0.5;
          float dots = smoothstep(0.16, 0.12, length(gf)) * step(0.5, fract((gi.x+gi.y)*0.5 + floor(ph)*0.5));
          vec3 col = mix(P*0.55 + uInk*0.4, uY, dots*0.55);
          float ax = abs(p.x);
          float H = 0.30;
          if (ax < W0 && abs(p.y) < H) {
            float N = 9.0;
            float xx = p.x / W0 * N;
            float f = fract(xx), tri = abs(f*2.0 - 1.0);
            float id = floor(xx);
            vec3 pc = mod(id, 2.0) < 1.0 ? P : uY;
            float shade = 0.55 + 0.45*tri;
            col = pc * shade + W*pow(tri, 12.0)*0.35;
            col = mix(uInk, col, smoothstep(0.0, 0.05, tri));
            float trim = smoothstep(H-0.05, H-0.045, abs(p.y));
            float dm = step(0.5, fract((p.x*12.0 + abs(p.y)*12.0)));
            col = mix(col, mix(uInk, W, dm*0.8), trim);
          } else if (ax < W0 + 0.2 && abs(p.y) < H + 0.06) {
            vec2 q = vec2(ax - W0 - 0.1, p.y);
            col = mix(uY, W, 0.15);
            vec2 bg = fract(q*vec2(16.0, 16.0)) - 0.5;
            float bt = smoothstep(0.32, 0.26, length(bg));
            col = mix(col, uInk, bt*0.9);
            col = mix(col, uInk, smoothstep(0.012, 0.0, min(abs(q.x)-0.098, abs(p.y)-(H+0.058))*-1.0));
          }
          return col;
        }
        // 4 — Ondas: franjas de color apiladas que se ondulan con el audio
        vec3 sEq(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(P*0.5 + uInk*0.4, P, smoothstep(-0.5, 0.5, p.y));
          for (int i = 0; i < 8; i++) {
            float fi = float(i);
            float yi = 0.46 - fi*0.125;
            float A = 0.025 + 0.075*band(mod(fi*2.0, 16.0));
            float wv = yi + A*sin(p.x*(4.0 + fi*0.7) + ph*PI*0.5*e + fi*1.3)
                          + 0.02*sin(p.x*11.0 - t*1.7 + fi);
            float m = mod(fi, 4.0);
            vec3 c = m < 1.0 ? uY : (m < 2.0 ? W : (m < 3.0 ? mix(P, W, 0.35) : vec3(1.0, 0.55, 0.15)));
            if (p.y < wv) col = mix(c, c*0.82, smoothstep(wv, wv - 0.12, p.y));
            col = mix(col, uInk, smoothstep(0.007, 0.0, abs(p.y - wv)));
          }
          return col;
        }
        // 5 — Warhol: fondo de semitono (las celdas son DOM)
        vec3 sWarhol(vec2 p, vec3 P, float e, float ph, float t){
          vec2 g = p*rot(0.4)*28.0; vec2 gf = fract(g) - 0.5;
          float d = smoothstep(0.3, 0.25, length(gf));
          return mix(uY, P, d*0.5);
        }
        vec3 popC(float i, vec3 P){
          i = mod(i, 5.0);
          if (i < 1.0) return uY;
          if (i < 2.0) return P;
          if (i < 3.0) return W;
          if (i < 4.0) return mix(P, W, 0.45);
          return mix(uY, vec3(1.0, 0.45, 0.1), 0.6);
        }
        // 6 — Bloques pop (Britto)
        vec3 sBritto(vec2 p, vec3 P, float e, float ph, float t){
          float seg = floor(ph/16.0);
          float sc = 3.6 + mod(seg, 2.0)*1.4;
          vec2 g = p*sc + vec2(ph*0.08*e, -ph*0.04*e);
          g = rot(0.35 + 0.08*seg) * g;
          vec2 id = floor(g), f = fract(g);
          float bar = floor(ph/4.0);
          float hb = floor(hash(id)*5.0);
          vec3 cc = popC(hb + bar, P);
          float dots = step(0.5, hash(id+9.1)) * smoothstep(0.30, 0.26, length(fract(f*3.0)-0.5));
          cc = mix(cc, mod(hb, 2.0) < 1.0 ? W : uInk, dots*0.85);
          float stripe = step(0.72, hash(id+4.2)) * step(0.5, fract((f.x+f.y)*5.0));
          cc = mix(cc, uInk, stripe*0.9);
          float heart = 0.0;
          if (hash(id+2.2) > 0.84) { vec2 q = (f - 0.5)*2.4; q.y = -q.y + 0.1;
            float hv = pow(q.x*q.x + q.y*q.y - 0.3, 3.0) - q.x*q.x*q.y*q.y*q.y; heart = step(hv, 0.0); }
          cc = mix(cc, mod(hb, 2.0) < 1.0 ? P : uY, heart);
          float edge = min(min(f.x, 1.0-f.x), min(f.y, 1.0-f.y));
          return cc * smoothstep(0.03, 0.045, edge);
        }
        // 7 — Caleidoscopio
        vec3 sCaleido(vec2 p, vec3 P, float e, float ph, float t){
          float seg = floor(ph/16.0);
          float n = 8.0 + 4.0*mod(seg, 2.0);
          p *= rot(ph*0.04*e);
          float r = length(p), a = atan(p.y, p.x);
          a = abs(mod(a, TAU/n) - PI/n);
          vec2 q = r*vec2(cos(a), sin(a));
          float v = sin(r*16.0 - ph*PI*0.25*e) + 0.6*sin(q.x*22.0 + t*0.9) + 0.6*cos(q.y*30.0 - t*1.1);
          float b = fract(v*0.35 + 0.5);
          vec3 col = b < 0.25 ? uInk : (b < 0.5 ? P : (b < 0.78 ? uY : W));
          col = mix(col, uY, smoothstep(0.1, 0.0, r)*0.8);
          return col * (0.9 + 0.1*beatK(ph));
        }
        float segD(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba)/dot(ba, ba), 0.0, 1.0); return length(pa - ba*h); }
        float palm(vec2 p, vec2 base, float H, float lean, float sway){
          float d = 1e3;
          vec2 prev = base;
          for (int i = 1; i <= 6; i++) { float u = float(i)/6.0; vec2 q = base + vec2(lean*u*u*H + sway*u*u*0.02, u*H); d = min(d, segD(p, prev, q) - 0.012*(1.2 - u*0.5)); prev = q; }
          vec2 top = prev;
          for (int k = 0; k < 7; k++) {
            float a = -0.3 + float(k)*0.52 + sway*0.05;
            vec2 dir = vec2(cos(a + 1.57), sin(a + 1.57)) * vec2(1.0, 0.7);
            vec2 pp = top;
            for (int j = 1; j <= 5; j++) { float s = float(j)/5.0*0.17; vec2 q = top + dir*s - vec2(0.0, 1.6*s*s); d = min(d, segD(p, pp, q) - 0.011*(1.0 - float(j)/6.0)); pp = q; }
          }
          return d;
        }
        // 8 — Paisaje gráfico: sierra, sol retro, mar
        vec3 sPaisaje(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(mix(uY, P, 0.25), P*0.85, smoothstep(-0.05, 0.5, p.y));
          vec2 sc = vec2(0.0, -0.02);
          float sr = length(p - sc);
          float stripes = step(0.5, fract((p.y + t*0.03) * 22.0)) * step(p.y, sc.y);
          float sun = smoothstep(0.30, 0.295, sr) * (1.0 - stripes*smoothstep(0.0, -0.2, p.y - sc.y));
          col = mix(col, mix(uY, W, 0.25), sun);
          col += uY * exp(-max(sr - 0.3, 0.0)*5.0) * 0.25;
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            float hgt = -0.02 - fi*0.07 + 0.16*fbm(p.x*(1.6 + fi*0.7) + t*0.015*(fi+1.0)*e + fi*7.0) - 0.05;
            vec3 mc = mix(P*0.7, uInk, 0.25 + fi*0.28);
            col = mix(col, mc, step(p.y, hgt));
          }
          if (p.y < -0.3) {
            vec3 sea = mix(P*0.45, uInk, smoothstep(-0.3, -0.5, p.y));
            float sh = step(0.86, fract(p.y*40.0 + sin(p.x*9.0 + t*1.5)*0.6)) * smoothstep(0.5, 0.0, abs(p.x));
            col = mix(sea, uY, sh*0.8);
          }
          float sw = sin(t*0.8*e);
          float pd = min(palm(p, vec2(-0.78, -0.5), 0.62, 0.35, sw), palm(p, vec2(0.72, -0.5), 0.5, -0.3, -sw));
          col = mix(col, uInk, smoothstep(0.004, 0.0, pd));
          return col;
        }
        // 9 — Haces de luz de escenario
        vec3 sHaces(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(uInk*1.4, P*0.55, smoothstep(-0.6, 0.6, p.y));
          float haze = noise(p*3.0 + vec2(t*0.1, 0.0))*0.22;
          col += P*haze;
          for (int i = 0; i < 6; i++) {
            float fi = float(i);
            bool top = i < 4;
            vec2 o = top ? vec2(-0.66 + fi*0.44, 0.58) : vec2(-0.5 + (fi-4.0)*1.0, -0.58);
            float a = (top ? -PI*0.5 : PI*0.5) + sin(ph*PI/8.0*e + fi*1.9)*0.6;
            vec2 dir = vec2(cos(a), sin(a));
            vec2 d = p - o;
            float along = dot(d, dir), across = abs(d.x*dir.y - d.y*dir.x);
            float w = 0.02 + along*0.16;
            float beam = smoothstep(w, w*0.15, across) * step(0.0, along) * exp(-along*0.55);
            vec3 bc = mod(fi, 2.0) < 1.0 ? uY : mix(P, W, 0.3);
            col += bc * beam * (0.8 + 0.5*beatK(ph + fi*0.5));
            col += bc * exp(-length(d)*30.0) * 0.8;
          }
          return col;
        }
        // 10 — Confeti y serpentinas
        vec3 sConfeti(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(P, mix(uY, P, 0.35), smoothstep(-0.6, 0.6, p.y));
          for (int L = 0; L < 3; L++) {
            float fl = float(L);
            float s = 7.0 + fl*4.0;
            vec2 g = p*s + vec2(sin(t*0.7 + fl)*0.6, t*(1.0 + fl*0.35)*e);
            vec2 id = floor(g), f = fract(g) - 0.5;
            float h = hash(id + fl*13.0);
            if (h > 0.45) {
              vec2 q = rot(t*(1.5 + h*3.0) + h*TAU) * (f + (vec2(hash(id+1.3), hash(id+2.7)) - 0.5)*0.4);
              q.x /= max(0.15, abs(cos(t*3.0*h + h*9.0)));
              float rect = step(abs(q.x), 0.16) * step(abs(q.y), 0.07);
              vec3 cc = h < 0.6 ? uY : (h < 0.75 ? W : (h < 0.9 ? mix(P, W, 0.4) : uInk));
              col = mix(col, cc, rect);
            }
          }
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            float y = 0.45 - fi*0.4 + 0.08*sin(p.x*4.0 + t*1.3 + fi*2.0);
            float rb = smoothstep(0.014, 0.008, abs(p.y - y));
            col = mix(col, mod(fi, 2.0) < 1.0 ? uY : W, rb);
          }
          return col;
        }
        // 11 — TIKO gigante: fondo de rayas (el texto es DOM)
        vec3 sTiko(vec2 p, vec3 P, float e, float ph, float t){
          float s = step(0.5, fract((p.x*0.7 + p.y)*6.0 - ph*0.25*e));
          return mix(P, mix(P, uInk, 0.35), s);
        }
        // 12 — Cielo de estrellas fugaces
        vec3 sEstrellas(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(mix(P*0.55, uY*0.6, 0.35), uInk*0.8, smoothstep(-0.5, 0.45, p.y));
          for (int L = 0; L < 2; L++) {
            float s = 24.0 + float(L)*20.0;
            vec2 g = p*s; vec2 id = floor(g), f = fract(g) - 0.5;
            float h = hash(id + float(L)*7.0);
            float tw = 0.5 + 0.5*sin(t*(1.0 + h*3.0) + h*40.0);
            col += mix(W, uY, h) * smoothstep(0.08, 0.0, length(f - (vec2(hash(id+1.1), hash(id+2.2))-0.5)*0.7)) * step(0.7, h) * tw;
          }
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            float per = 8.0;
            float u = fract((ph + fi*2.7) / per);
            vec2 a0 = vec2(-1.0 + hash(vec2(fi, floor((ph + fi*2.7)/per)))*1.2, 0.55);
            vec2 dir = normalize(vec2(1.0, -0.45));
            vec2 head = a0 + dir*u*2.2;
            vec2 d = p - head;
            float along = -dot(d, dir), across = abs(d.x*dir.y - d.y*dir.x);
            float tail = smoothstep(0.004, 0.0, across - along*0.01) * step(0.0, along) * exp(-along*5.0);
            col += mix(uY, W, 0.5) * (tail + exp(-length(d)*90.0)) * smoothstep(0.0, 0.1, u) * smoothstep(1.0, 0.7, u);
          }
          return col;
        }
        // 13 — Bombillas de marquesina
        vec3 sBombillas(vec2 p, vec3 P, float e, float ph, float t){
          float mode = mod(floor(ph/16.0), 3.0);
          vec3 col = mix(uInk, P*0.35, 0.5 + 0.5*p.y);
          float S = 0.052;
          vec2 g = p/S; vec2 id = floor(g), f = fract(g) - 0.5;
          vec2 c = (id + 0.5)*S;
          float lit;
          if (mode < 1.0) lit = step(0.55, fract((id.x + id.y)*0.08 - ph*0.5*e));
          else if (mode < 2.0) lit = step(0.6, fract(length(c)*3.0 - ph*0.5*e));
          else { vec2 q = c*vec2(1.0, -1.0)*2.4 + vec2(0.0, 0.25);
            float hv = pow(q.x*q.x + q.y*q.y - 0.3, 3.0) - q.x*q.x*q.y*q.y*q.y;
            lit = step(hv, 0.0) * (0.55 + 0.45*beatK(ph)) + step(0.0, hv)*step(0.85, hash(id + floor(ph)))*0.6; }
          vec3 bc = mod(id.x + id.y, 2.0) < 1.0 ? uY : mix(uY, W, 0.5);
          if (mode > 1.5) bc = mix(P, W, 0.25);
          float d = length(f);
          float core = smoothstep(0.24, 0.18, d);
          col = mix(col, uInk*1.3 + P*0.12, core);
          col += bc * (core*lit*1.1 + exp(-d*7.0)*lit*0.45);
          // marco de cartel con bombillas que persiguen
          vec2 b = abs(p) - vec2(0.82, 0.44);
          float frame = smoothstep(0.03, 0.02, abs(max(b.x, b.y)));
          float along = (p.x + p.y)*30.0;
          float chase = step(0.5, fract(along*0.25 - ph*e));
          col = mix(col, mix(P, uY, chase), frame);
          return col;
        }
        // 14 — Op-art cebra con figuras de color
        vec3 sZebra(vec2 p, vec3 P, float e, float ph, float t){
          float w = noise(p*2.0 + t*0.15)*0.6;
          float v = sin((p.x*0.8 + p.y*0.5 + 0.12*sin(p.y*5.0 + ph*PI*0.25*e) + w)*42.0);
          vec3 col = mix(uInk, W, step(0.0, v));
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            vec2 c = vec2(sin(t*0.3*e + fi*2.1)*0.55, cos(t*0.23*e + fi*1.7)*0.28);
            float r = 0.17 + 0.05*sin(ph*PI*0.5 + fi) ;
            float inside = fi < 1.5 ? step(length(p - c), r) : step(max(abs(p.x-c.x), abs(p.y-c.y)), r*0.85);
            float v2 = sin(((p - c)*rot(1.57 + fi)).x*60.0 + ph*PI*0.5);
            vec3 cc = mix(fi < 0.5 ? uY : (fi < 1.5 ? P : mix(uY, P, 0.5)), uInk, step(0.3, v2)*0.85);
            col = mix(col, cc, inside);
          }
          return col;
        }
        // 15 — Líquido psicodélico
        vec3 sLiquido(vec2 p, vec3 P, float e, float ph, float t){
          vec2 q = p*1.6;
          float tt = t*0.18*e;
          vec2 a = vec2(noise(q + vec2(0.0, tt)), noise(q + vec2(5.2, -tt)));
          vec2 b = vec2(noise(q + a*2.2 + vec2(1.7, 9.2) + tt), noise(q + a*2.2 + vec2(8.3, 2.8) - tt));
          float v = noise(q + b*2.6 + 0.3*sin(ph*PI*0.5));
          float k = fract(v*3.2 + tt*0.4);
          vec3 col = k < 0.2 ? uInk : (k < 0.42 ? P : (k < 0.62 ? uY : (k < 0.8 ? W : mix(P, W, 0.45))));
          float edge = min(min(abs(k-0.2), abs(k-0.42)), min(abs(k-0.62), abs(k-0.8)));
          col = mix(col, uInk, smoothstep(0.018, 0.0, edge)*0.6);
          col += vec3(0.5, 0.9, 1.0) * pow(max(0.0, sin(v*30.0 + tt*3.0)), 18.0) * 0.18;
          return col;
        }
        // 16 — Fachada republicana con ventanas que se encienden
        vec3 sFachada(vec2 p, vec3 P, float e, float ph, float t){
          vec3 col = mix(P*0.45 + uInk*0.4, uInk, smoothstep(-0.1, 0.5, p.y));
          float sx = p.x;
          float top = 0.3;
          if (p.y < top && abs(sx) < 0.86) {
            col = mix(uY, vec3(1.0, 0.72, 0.35), 0.35) * (0.8 + 0.2*smoothstep(-0.5, 0.3, p.y));
            // cornisa y franjas
            col = mix(col, W, smoothstep(0.012, 0.0, abs(p.y - top + 0.03)));
            col = mix(col, uInk, smoothstep(0.006, 0.0, abs(p.y - top + 0.06)));
            col = mix(col, uInk, smoothstep(0.006, 0.0, abs(p.y + 0.06)));
            float cols = 7.0;
            float cx = (sx + 0.86)/1.72*cols; float ix = floor(cx), fx = fract(cx) - 0.5;
            float floorI = p.y > -0.06 ? 1.0 : 0.0;
            float y0 = floorI > 0.5 ? 0.1 : -0.25;
            float hgt = 0.13;
            vec2 wq = vec2(fx*0.246, p.y - y0);
            float win = step(abs(wq.x), 0.05) * step(abs(wq.y), hgt*0.5);
            float arch = step(length(wq - vec2(0.0, hgt*0.5)), 0.05) * step(hgt*0.5, wq.y);
            float shape = max(win, arch);
            float idx = ix + floorI*7.0;
            float m = mod(floor(ph/8.0), 3.0);
            float lit = m < 1.0 ? step(0.5, fract((idx - ph*e)/4.0)) : (m < 2.0 ? step(0.5, fract(ix*0.5 + floor(ph)*0.5)) : beatK(ph + ix*0.25));
            vec3 wc = mix(uInk*1.5, mix(P, W, 0.2 + 0.4*lit), lit);
            float frameW = max(step(abs(wq.x), 0.062) * step(abs(wq.y), hgt*0.5 + 0.012), step(length(wq - vec2(0.0, hgt*0.5)), 0.062) * step(hgt*0.5, wq.y));
            col = mix(col, W, frameW);
            col = mix(col, wc, shape);
            // balcones del piso alto
            float bal = floorI > 0.5 ? step(abs(wq.x), 0.075) * smoothstep(0.008, 0.0, abs(wq.y + hgt*0.5 + 0.01)) : 0.0;
            float bars = floorI > 0.5 ? step(abs(wq.x), 0.075) * step(-hgt*0.5 - 0.06, wq.y) * step(wq.y, -hgt*0.5) * step(0.7, fract(wq.x*80.0)) : 0.0;
            col = mix(col, uInk, max(bal, bars));
            // portón central
            if (ix == 3.0 && floorI < 0.5) col = mix(col, mix(P*0.6, uY, beatK(ph)*0.5), step(abs(wq.x), 0.06));
          }
          col += P * exp(-abs(p.y - top)*12.0) * 0.15 * step(top, p.y);
          return col;
        }
        // 17 — Cubos isométricos (bloques que ruedan)
        vec3 sCubos(vec2 p, vec3 P, float e, float ph, float t){
          p *= rot(0.05*sin(ph*PI/16.0));
          float sc = 5.0 + mod(floor(ph/16.0), 2.0)*2.0;
          vec2 q = p*sc + vec2(ph*0.12*e, 0.0);
          vec2 r = vec2(1.0, 1.7320508);
          vec2 h = r*0.5;
          vec2 a = mod(q, r) - h, b = mod(q - h, r) - h;
          vec2 g = dot(a, a) < dot(b, b) ? a : b;
          vec2 cid = q - g;
          float ang = atan(g.y, g.x);
          float face = ang > PI/6.0 && ang < PI*5.0/6.0 ? 0.0 : (ang <= PI/6.0 && ang > -PI/2.0 ? 1.0 : 2.0);
          float k = mod(floor(hash(floor(cid*2.0)) * 3.0) + floor(ph/4.0), 3.0);
          vec3 c0 = k < 1.0 ? uY : (k < 2.0 ? W : mix(P, W, 0.4));
          vec3 col = face < 0.5 ? c0 : (face < 1.5 ? P : mix(P, uInk, 0.6));
          float hexd = max(abs(g.x)*0.866 + abs(g.y)*0.5, abs(g.y));
          float edges = smoothstep(0.012, 0.0, abs(hexd - 0.5)) ;
          float inner = smoothstep(0.012, 0.0, min(abs(ang - PI/6.0), min(abs(ang - PI*5.0/6.0), abs(ang + PI/2.0))) * length(g)) * step(length(g), 0.5);
          col = mix(col, uInk, max(edges, inner*0.9));
          return col * (0.92 + 0.08*beatK(ph));
        }
        vec3 sceneCol(float id, vec2 p, vec3 P, float e, float ph, float t){
          if (id < 1.5) return sSol(p, P, e, ph, t);
          if (id < 2.5) return sTunel(p, P, e, ph, t);
          if (id < 3.5) return sAcordeon(p, P, e, ph, t);
          if (id < 4.5) return sEq(p, P, e, ph, t);
          if (id < 5.5) return sWarhol(p, P, e, ph, t);
          if (id < 6.5) return sBritto(p, P, e, ph, t);
          if (id < 7.5) return sCaleido(p, P, e, ph, t);
          if (id < 8.5) return sPaisaje(p, P, e, ph, t);
          if (id < 9.5) return sHaces(p, P, e, ph, t);
          if (id < 10.5) return sConfeti(p, P, e, ph, t);
          if (id < 11.5) return sTiko(p, P, e, ph, t);
          if (id < 12.5) return sEstrellas(p, P, e, ph, t);
          if (id < 13.5) return sBombillas(p, P, e, ph, t);
          if (id < 14.5) return sZebra(p, P, e, ph, t);
          if (id < 15.5) return sLiquido(p, P, e, ph, t);
          if (id < 16.5) return sFachada(p, P, e, ph, t);
          return sCubos(p, P, e, ph, t);
        }
        void main(){
          vec2 px = vUv*uRes;
          vec2 p = (px - 0.5*uRes)/uRes.y;
          vec3 col = sceneCol(uSB, p, uPB, uEB, uPh, uT - uTB);
          if (uMix < 0.999) col = mix(sceneCol(uSA, p, uPA, uEA, uPh, uT - uTA), col, uMix);
          vec2 v = vUv - 0.5; col *= 1.0 - dot(v, v)*0.5;
          col += (hash(px + uFrame) - 0.5)*0.015;
          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }`;
      const mat = new THREE.ShaderMaterial({ uniforms: U,
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: frag });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

      const B = SH.beats, BEAT = SH.barSeconds / 4;
      function phaseAt(t) {
        if (t <= B[0]) return (t - B[0]) / BEAT;
        if (t >= B[B.length - 1]) return B.length - 1 + (t - B[B.length - 1]) / BEAT;
        let lo = 0, hi = B.length - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (B[m] <= t) lo = m; else hi = m; }
        return lo + (t - B[lo]) / (B[lo + 1] - B[lo]);
      }
      const ss = (x) => x * x * (3 - 2 * x);
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255);
      U.uY.value.set(...hex(SH.yellow)); U.uInk.value.set(...hex(SH.ink));
      const A = SH.prev, C = SH.cur;
      U.uSA.value = A.scene; U.uPA.value.set(...hex(A.partner)); U.uEA.value = A.energy; U.uTA.value = A.t0;
      U.uSB.value = C.scene; U.uPB.value.set(...hex(C.partner)); U.uEB.value = C.energy; U.uTB.value = C.t0;
      const $ = (id) => document.getElementById(id);
      const E = SH.energy;

      // Celdas Warhol: reparto de colores que rota cada beat.
      function warhol(el, ph, partner) {
        if (!el) return;
        const cols = [SH.yellow, partner, "#ffffff", SH.yellow, partner, "#ff9a3c"];
        const k = Math.floor(ph);
        el.querySelectorAll(".cell").forEach((c, i) => {
          c.style.background = cols[(i + k) % 6];
          c.querySelector(".sil").style.background = cols[(i + k + 2) % 6];
          const b = Math.exp(-(((ph % 1) + 1) % 1) * 3.5);
          c.style.transform = "scale(" + (1 + 0.025 * b).toFixed(4) + ")";
        });
      }
      function tiko(el, ph, e) {
        if (!el) return;
        el.querySelectorAll(".tk-row").forEach((r, i) => {
          const dir = i % 2 ? 1 : -1, x = ((ph * 38 * e * dir) % 1300 + 1300) % 1300;
          r.style.transform = "translateX(" + (-x).toFixed(1) + "px)";
        });
      }

      function renderAt(time) {
        const t = SH.start + time;
        const ph = phaseAt(t);
        const ft = t <= SH.songEnd ? t : SH.songEnd - 16 + ((t - SH.songEnd) % 16);
        const f = Math.min(E.n - 1, Math.max(0, Math.round((ft - E.t0) * E.fps)));
        U.uT.value = t; U.uPh.value = ph; U.uFrame.value = Math.round(t * 30);
        U.uLo.value = E.low[f]; U.uHi.value = E.high[f];
        for (let k = 0; k < 16; k++) U.uB.value[k] = E.bands[f][k];
        const mix = SH.isFirst ? 1 : ss(clamp01((t - C.t0) / SH.xfade));
        U.uMix.value = mix;
        renderer.render(scene, camera);

        const bk = Math.exp(-(((ph % 1) + 1) % 1) * 3.5);
        // Capas DOM de la escena saliente (A) y entrante (C).
        [["A", A, 1 - mix], ["C", C, mix]].forEach(([k, P, o]) => {
          const wh = $("wh" + k), tk = $("tk" + k);
          if (wh) { wh.style.opacity = o.toFixed(3); warhol(wh, ph, P.partner); }
          if (tk) { tk.style.opacity = o.toFixed(3); tiko(tk, ph, P.energy); }
        });
        // Logo y foto (entrada suave, latido leve).
        const show = (on0, on1) => on1 * mix + on0 * (1 - mix);
        const lo = show(A.logo ? 1 : 0, C.logo ? 1 : 0), po = show(A.photo ? 1 : 0, C.photo ? 1 : 0);
        const logo = $("logo"); if (logo) { logo.style.opacity = lo.toFixed(3); logo.style.transform = "scale(" + (1 + 0.03 * bk).toFixed(4) + ")"; }
        const photo = $("photo"); if (photo) { photo.style.opacity = po.toFixed(3); photo.style.transform = "translateY(" + (Math.sin(t * 0.6) * 10).toFixed(1) + "px)"; }
        // Acentos de letra.
        document.querySelectorAll(".lyr").forEach((el) => {
          const a = +el.dataset.t0, b = +el.dataset.t1;
          const o = clamp01((t - a) / 0.25) * clamp01((b - t) / 0.35);
          el.style.opacity = o.toFixed(3);
          el.style.transform = "scale(" + (0.92 + 0.08 * ss(clamp01((t - a) / 0.3)) + 0.02 * bk * o).toFixed(4) + ")";
        });
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
