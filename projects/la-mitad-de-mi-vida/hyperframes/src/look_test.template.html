<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>La mitad de mi vida — look test</title>
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Basker";
        src: url("fonts/BASKVILL.TTF") format("truetype");
      }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #000; }
      #sea-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      .phrase-wrap { position: absolute; left: 0; width: 1920px; height: 140px; display: flex;
        align-items: center; justify-content: center; }
      #phrase-wrap { top: 310px; }
      /* Mirror about the horizon (y = 594): centre 380 -> 808 */
      #refl-wrap { top: 738px; }
      .phrase { display: block; font-family: "Basker", Georgia, serif; font-size: 96px;
        letter-spacing: 0.06em; color: #f3ead8; white-space: nowrap; opacity: 0;
        text-shadow: 0 0 28px rgba(243, 214, 160, 0.35); }
      #refl { transform: scaleY(-1); filter: blur(2.2px);
        -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0) 85%);
        mask-image: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0) 85%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="__DURATION__">
      <div id="bg"></div>
      <section id="sea" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1"
        style="position:absolute;inset:0;">
        <canvas id="sea-layer" width="1920" height="1080"></canvas>
      </section>
      <section id="lyric" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="2"
        style="position:absolute;inset:0;">
        <div id="phrase-wrap" class="phrase-wrap"><span id="phrase" class="phrase">la mitad de mi vida</span></div>
        <div id="refl-wrap" class="phrase-wrap"><span id="refl" class="phrase">la mitad de mi vida</span></div>
      </section>
    </div>

    <script>
      // ---- Song-time keyframes (free_run: slow, drift-tolerant) ----
      window.LT = {
        songStart: __SONG_START__,
        energy: __ENERGY__,
      };
      const S0 = window.LT.songStart;
      const at = (songT) => songT - S0; // song seconds -> composition seconds

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Phrase: in over 2.5 s, held, out over 1.9 s.
      tl.fromTo("#phrase", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 2.5, ease: "sine.out" }, at(43.2));
      tl.to("#phrase", { opacity: 0, y: -8, duration: 1.9, ease: "sine.in" }, at(53.6));
      // Reflection appears only as the sea calms (44.5 -> 48.4), like the moon's.
      tl.fromTo("#refl", { opacity: 0 }, { opacity: 0.32, duration: 3.9, ease: "sine.inOut" }, at(44.5));
      tl.to("#refl", { opacity: 0, duration: 1.9, ease: "sine.in" }, at(53.6));
      // Slow ripple on the reflection (finite repeat).
      const rippleDur = 1.3;
      tl.fromTo("#refl", { x: -3 }, { x: 3, duration: rippleDur, ease: "sine.inOut", yoyo: true,
        repeat: Math.max(0, Math.floor(__DURATION__ / rippleDur) - 1) }, 0);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("sea-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
      renderer.setSize(1920, 1080, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        uRes: { value: new THREE.Vector2(1920, 1080) },
        uTime: { value: 0 },
        uCalm: { value: 0 },
        uMist: { value: 0 },
        uLo: { value: 0 },
        uHi: { value: 0 },
        uFrame: { value: 0 },
      };

      const frag = `
        precision highp float;
        uniform vec2 uRes; uniform float uTime, uCalm, uMist, uLo, uHi, uFrame;
        varying vec2 vUv;
        const float H = 0.45;      // horizon height (from bottom)
        const float R = 0.13;      // moon radius (in frame-height units)

        float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
        float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }

        vec3 skyCol(vec2 p, float aspect){
          float h = clamp((p.y - H)/(1.0 - H), 0.0, 1.0);
          vec3 c = mix(vec3(0.040,0.062,0.110), vec3(0.008,0.013,0.032), pow(h, 0.6));
          return c;
        }
        vec3 moonCol(vec2 p, vec2 mc, float glow){
          float d = length(p - mc);
          float disc = smoothstep(R, R - 0.003, d);
          float tex = 0.80 + 0.20*fbm((p - mc)*16.0 + 3.0);
          vec3 c = vec3(0.86, 0.80, 0.66) * tex * disc;
          float halo = exp(-max(d - R, 0.0)*11.0) * (0.10 + 0.10*glow) * (1.0 - disc);
          return c + vec3(0.85,0.75,0.55)*halo;
        }
        float stars(vec2 p){
          vec2 g = p*190.0; vec2 id = floor(g); float h = hash(id);
          if (h < 0.986) return 0.0;
          vec2 f = fract(g) - 0.5; float d = length(f);
          float tw = 0.55 + 0.45*sin(uTime*(0.6 + h*1.7) + h*60.0);
          return smoothstep(0.18, 0.0, d) * tw * (h - 0.986) * 70.0;
        }

        void main(){
          float aspect = uRes.x/uRes.y;
          vec2 p = vec2(vUv.x*aspect, vUv.y);
          vec2 mc = vec2(0.5*aspect, H);
          vec3 col;

          if (p.y >= H) {
            col = skyCol(p, aspect);
            float fade = smoothstep(H, H + 0.12, p.y);
            col += vec3(0.85,0.88,1.0) * stars(p) * fade * 0.9;
            col += moonCol(p, mc, uCalm);
          } else {
            float depth = H - p.y;                       // 0 at horizon
            float z = 1.0/(depth + 0.03);
            float t = uTime;
            float amp = mix(0.055, 0.006, uCalm);
            float n1 = noise(vec2(p.x*2.2*z*0.12, z*0.9 - t*0.32));
            float n2 = noise(vec2(p.x*5.0*z*0.12 + 7.0, z*1.7 - t*0.55));
            vec2 rp = vec2(p.x + (n1 - 0.5)*amp*(0.4 + depth*3.0),
                           H + depth + (n2 - 0.5)*amp*0.5);
            // Broken reflection: horizontal streaks while the sea is rough.
            float streak = smoothstep(0.38, 0.62, noise(vec2(p.x*1.6, z*3.2 - t*0.7)));
            // Even calm water keeps a soft horizontal shimmer.
            float shimmer = 0.72 + 0.28*noise(vec2(p.x*0.9, z*9.0 - t*0.45));
            float mask = mix(streak, shimmer, uCalm);
            float fres = 0.55 + 0.35*exp(-depth*6.0);
            vec3 refl = moonCol(rp, mc, uCalm) * mask * fres * 0.50 * exp(-depth*1.2) + skyCol(rp, aspect)*0.40;
            vec3 sea = vec3(0.006, 0.011, 0.024) + refl;
            // Moon-path glints: breathe with the (smoothed) high band.
            float colw = 0.07 + depth*0.55;
            float path = exp(-pow((p.x - mc.x)/colw, 2.0));
            // Glints: long horizontal slivers (low x freq, high depth freq), not cells.
            float sp = smoothstep(0.78, 0.98, noise(vec2(p.x*22.0 + sin(z*3.1)*2.0, z*85.0 - t*1.1)));
            sp *= smoothstep(0.45, 0.85, noise(vec2(p.x*7.0, z*30.0 + t*0.4)));
            sea += vec3(1.0,0.92,0.75) * sp * pow(path, 1.6) * (0.25 + 0.9*uHi) * (1.0 - 0.5*uCalm) * 1.4;
            // Long low swells, lit faintly by the moon.
            float sw = fbm(vec2(p.x*1.2*z*0.1, z*0.6 - t*0.18));
            sea += vec3(0.03,0.04,0.07) * sw * (0.5 + 0.6*uLo) * exp(-depth*2.0);
            col = sea;
          }
          // Horizon line + mist.
          col += vec3(0.10,0.11,0.15) * exp(-abs(p.y - H)*260.0) * 0.6;
          float m = fbm(vec2(p.x*1.8 + uTime*0.025, p.y*7.0 - uTime*0.01));
          col += vec3(0.11,0.12,0.16) * m * exp(-abs(p.y - H)*9.0) * uMist;
          // Vignette + grain.
          vec2 q = vUv - 0.5; col *= 1.0 - dot(q, q)*0.9;
          col += (hash(vUv*uRes + uFrame) - 0.5) * 0.018;
          gl_FragColor = vec4(pow(max(col, 0.0), vec3(0.95)), 1.0);
        }`;

      const mat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: frag,
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

      const LT = window.LT;
      const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a)/(b - a))); return t*t*(3 - 2*t); };

      function renderAt(time) {
        const song = LT.songStart + time;
        const f = Math.min(LT.energy.frames - 1, Math.max(0, Math.round(time * LT.energy.fps)));
        const calm = 0.12 + 0.88*smooth(44.5, 48.4, song);
        uniforms.uTime.value = song;
        uniforms.uCalm.value = calm;
        uniforms.uMist.value = 0.85 - 0.5*smooth(44.5, 48.4, song);
        uniforms.uLo.value = LT.energy.low[f];
        uniforms.uHi.value = LT.energy.high[f];
        uniforms.uFrame.value = f;
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
