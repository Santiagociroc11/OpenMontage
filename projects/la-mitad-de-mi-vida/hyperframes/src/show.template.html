    <style>
      @font-face { font-family: "Brush"; src: url("fonts/BRUSHSCI.TTF") format("truetype"); }

      body { margin: 0; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #000; }
      .layer { position: absolute; inset: 0; }
      #fx-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

      /* Mosaico de letra */
      .mosaic { position: absolute; left: -240px; top: -80px; width: 2400px; height: 1240px; opacity: 0; }

      .logo .dn { display: block; font-family: "Impact2"; color: #fff; letter-spacing: 0.12em; line-height: 1;
        text-shadow: 0 0 26px rgba(130, 170, 255, 0.9), 0 8px 0 rgba(20, 0, 60, 0.6); }
      #logo-l { left: 120px; top: 260px; width: 860px; }

      #logo-c .dn { font-size: 220px; -webkit-text-stroke: 4px #1a0040;
        text-shadow: 0 0 6px #1a0040, 0 10px 0 #1a0040, 0 0 40px rgba(130, 170, 255, 0.8); }
      #title { position: absolute; left: 120px; top: 760px; width: 860px; display: flex; justify-content: center; opacity: 0; }
      #title span { display: block; font-family: "Brush"; font-size: 104px; color: #fff4d6;

      /* Letra */

        transform: skewX(-9deg); text-shadow: 0 0 22px var(--glow), 0 6px 0 rgba(10, 0, 40, 0.6); }

        transform: skewX(-9deg); -webkit-text-stroke: 3px #ff2a5e;
        text-shadow: 0 0 30px rgba(255, 40, 100, 0.95), 0 7px 0 rgba(80, 0, 20, 0.7); }
      .card.hero .w, .card.hero2 .w { font-family: "Brush"; color: #fff4d6; line-height: 1;
        text-shadow: 0 0 18px rgba(255, 220, 140, 0.95), 0 0 60px rgba(255, 120, 60, 0.75), 0 8px 0 rgba(90, 0, 40, 0.55); }
      .card.hero .w { font-size: 250px; }
      .card.hero2 .w { font-size: 150px; }

  <body>

              <line x1="-68" y1="-68" x2="-50" y2="-50" /><line x1="68" y1="68" x2="50" y2="50" /><line x1="-68" y1="68" x2="-50" y2="50" /><line x1="68" y1="-68" x2="50" y2="-50" />

    <script>
      window.SHOW = __SHOW__;
      const SH = window.SHOW, S0 = SH.start, D = SH.duration;
      window.__timelines = window.__timelines || {};
      // Toda la letra se arma en tiempo de canción y se reproduce por tramos.
      const song = gsap.timeline({ paused: true });
      song.set({}, {}, SH.total);
      SH.cards.forEach((c) => {
        const sel = "#" + c.id + " .w", q = c.beat / 4;
        if (c.style === "hero" || c.style === "hero2") {
          song.fromTo(sel, { opacity: 0, scale: 0.8, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.7)", stagger: q }, c.t);
          song.to(sel, { opacity: 0, scale: 1.06, duration: 0.4, ease: "power2.in", stagger: 0.03 }, c.t1 - 0.4);
        } else {
          const big = c.style === "beso" ? 1.9 : 1.7;
          song.fromTo(sel, { opacity: 0, scale: big, y: -26 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)", stagger: q }, c.t);
          song.to(sel, { opacity: 0, y: 30, duration: 0.28, ease: "power2.in", stagger: 0.03 }, c.t1 - 0.3);
        }
      });
      const tl = gsap.timeline({ paused: true });
      tl.add(song.tweenFromTo(S0, S0 + D, { ease: "none" }), 0);
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      const SH = window.SHOW;
      const canvas = document.getElementById("fx-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
      renderer.setSize(1920, 1080, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const V3 = () => new THREE.Vector3();
      const U = {
        uRes: { value: new THREE.Vector2(1920, 1080) }, uTime: { value: 0 }, uPhase: { value: 0 },
        uTop: { value: V3() }, uBot: { value: V3() }, uRay: { value: V3() },
        uStars: { value: 0 }, uRays: { value: 0 }, uBlocks: { value: 0 }, uSpots: { value: 0 },
        uSun: { value: 0 }, uMist: { value: 0 }, uSpeed: { value: 2 }, uBurst: { value: -1 },
        uLo: { value: 0 }, uHi: { value: 0 }, uFrame: { value: 0 },
      };
      const frag = `
        precision highp float;
        uniform vec2 uRes; uniform float uTime, uPhase, uStars, uRays, uBlocks, uSpots, uSun, uMist, uSpeed, uBurst, uLo, uHi, uFrame;
        uniform vec3 uTop, uBot, uRay;
        varying vec2 vUv;
        float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
        vec2 hash2(vec2 p){ float h = hash(p); return vec2(h, hash(p + h*17.0)); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
        float starLayer(vec2 uv){
          vec2 id = floor(uv), gv = fract(uv) - 0.5; vec2 o = hash2(id) - 0.5;
          float d = length(gv - o*0.8); float b = hash(id + 3.7);
          return smoothstep(0.06, 0.0, d) * step(0.55, b) * (0.6 + 0.4*b);
        }
        vec3 popCol(float i){
          i = mod(i, 6.0);
          if (i < 1.0) return vec3(1.0, 0.85, 0.10);
          if (i < 2.0) return vec3(1.0, 0.18, 0.55);
          if (i < 3.0) return vec3(0.10, 0.80, 0.95);
          if (i < 4.0) return vec3(1.0, 0.45, 0.10);
          if (i < 5.0) return vec3(0.45, 0.90, 0.25);
          return vec3(0.55, 0.25, 0.95);
        }
        void main(){
          vec2 px = vUv*uRes;
          vec2 c = vec2(960.0, 1080.0 - 650.0);
          vec2 q = (px - c)/uRes.y;
          float r = length(q), ang = atan(q.y, q.x);
          float h = vUv.y;
          vec3 col = mix(uBot, uTop, smoothstep(0.0, 1.0, h));
          // Pop-art (Britto): celdas de color con trazo negro, color avanza por compás.
          if (uBlocks > 0.001) {
            vec2 g = vec2(vUv.x*uRes.x/uRes.y, vUv.y)*4.2 + vec2(uPhase*0.06, -uPhase*0.03);
            g = mat2(0.94, -0.34, 0.34, 0.94) * g;
            vec2 id = floor(g), f = fract(g);
            float bar = floor(uPhase/4.0), k = smoothstep(0.0, 1.0, fract(uPhase/4.0)*2.0);
            float hb = floor(hash(id)*6.0);
            vec3 cc = mix(popCol(hb + bar), popCol(hb + bar + 1.0), k);
            float dots = step(0.5, hash(id+9.1)) * smoothstep(0.30, 0.27, length(fract(f*3.0)-0.5));
            cc = mix(cc, vec3(1.0), dots*0.85);
            float stripe = step(0.72, hash(id+4.2)) * step(0.5, fract((f.x+f.y)*5.0));
            cc = mix(cc, vec3(0.05), stripe*0.9);
            float edge = min(min(f.x, 1.0-f.x), min(f.y, 1.0-f.y));
            cc *= smoothstep(0.035, 0.05, edge);
            col = mix(col, cc, uBlocks*0.92);
          }
          // Rayos desde el corazón.
          float rays = pow(0.5 + 0.5*cos(ang*12.0 + uPhase*0.7), 10.0) * exp(-r*1.2);
          col += uRay * rays * (0.22 + 0.25*uLo) * uRays;
          // Cañones de luz (disco) desde arriba.
          if (uSpots > 0.001) {
            for (int i = 0; i < 4; i++) {
              float fi = float(i);
              vec2 o = vec2((0.18 + fi*0.21)*uRes.x/uRes.y, 1.05);
              float a = -1.5708 + sin(uPhase*0.39 + fi*1.7)*0.55;
              vec2 dir = vec2(cos(a), sin(a));
              vec2 p = vec2(vUv.x*uRes.x/uRes.y, vUv.y) - o;
              float along = dot(p, dir), across = abs(p.x*dir.y - p.y*dir.x);
              float cone = smoothstep(0.08 + along*0.18, 0.0, across) * step(0.0, along) * exp(-along*0.9);
              col += mix(uRay, vec3(1.0), 0.3) * cone * 0.42 * uSpots;
            }
          }
          // Sol del amanecer detrás del corazón.
          if (uSun > 0.001) {
            vec2 sc = vec2(960.0, 1080.0 - 700.0);
            float sd = length(px - sc)/uRes.y;
            col = mix(col, vec3(1.0, 0.82, 0.45), smoothstep(0.30, 0.285, sd)*0.85*uSun);
            col += vec3(1.0, 0.6, 0.3) * exp(-sd*4.0) * 0.45 * uSun;
          }
          // Campo de estrellas en velocidad.
          float speed = 0.5 / max(uSpeed, 0.25);
          float st = 0.0;
          for (int i = 0; i < 4; i++) {
            float fi = float(i)/4.0;
            float depth = fract(fi + uPhase*speed);
            float scale = mix(26.0, 1.2, depth);
            float fade = smoothstep(0.0, 0.4, depth) * smoothstep(1.0, 0.85, depth);
            st += starLayer(q*scale + fi*91.7) * fade;
          }
          col += vec3(1.0, 0.95, 0.88) * st * (0.9 + 0.8*uHi) * uStars;
          // Brillo que respira en cada beat.
          float breath = 0.5 + 0.5*cos(6.2831853*uPhase);
          col += uRay * exp(-r*4.0) * (0.22 + 0.12*breath) * (1.0 - uBlocks*0.7);
          // Neblina (verso íntimo).
          col += vec3(0.25, 0.3, 0.5) * noise(vec2(vUv.x*3.0 + uTime*0.05, vUv.y*6.0)) * smoothstep(0.6, 0.0, h) * 0.25 * uMist;
          // Estallido.
          if (uBurst >= 0.0 && uBurst < 3.0) {
            float R = uBurst*1.15;
            float ring = exp(-pow((r - R)/0.035, 2.0)) * exp(-uBurst*1.4);
            float sp = step(0.82, hash(floor(vec2(ang*60.0, r*80.0))));
            col += vec3(1.0, 0.9, 0.6) * ring * (0.6 + 2.2*sp);
            col += vec3(1.0, 0.85, 0.6) * exp(-r*3.0) * exp(-uBurst*3.0) * 0.6;
          }
          vec2 v = vUv - 0.5; col *= 1.0 - dot(v, v)*0.6;
          col += (hash(px + uFrame) - 0.5)*0.02;
          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }`;
      const mat = new THREE.ShaderMaterial({ uniforms: U,
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
        fragmentShader: frag });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

      // ---------- Utilidades de tiempo ----------
      const B = SH.beats, BAR = SH.barSeconds;
      function phaseAt(t) {                      // beats transcurridos (fraccional)
        if (t <= B[0]) return (t - B[0]) / (BAR / 4);
        if (t >= B[B.length - 1]) return B.length - 1 + (t - B[B.length - 1]) / (BAR / 4);
        let lo = 0, hi = B.length - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (B[m] <= t) lo = m; else hi = m; }
        return lo + (t - B[lo]) / (B[lo + 1] - B[lo]);
      }
      const ss = (x) => x * x * (3 - 2 * x);
      function track(keys, t) {                  // [[t, v...], ...] suavizado
        if (t <= keys[0][0]) return keys[0].slice(1);
        for (let i = 0; i < keys.length - 1; i++) {
          const a = keys[i], b = keys[i + 1];
          if (t < b[0]) { const k = ss((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
            return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k); }
        }
        return keys[keys.length - 1].slice(1);
      }
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.substr(i, 2), 16) / 255);
      const SECS = SH.sections.map((s) => ({ ...s, top: hex(s.top), bot: hex(s.bot), ray: hex(s.ray) }));
      const KEYS = ["stars", "rays", "blocks", "spots", "sun", "mist", "speed"];
      function sectionParams(t) {
        let i = 0; while (i < SECS.length - 1 && SECS[i + 1].t0 <= t) i++;
        const cur = SECS[i], prev = SECS[Math.max(0, i - 1)];
        const k = i === 0 ? 1 : ss(Math.min(1, (t - cur.t0) / 1.2));
        const mix = (a, b) => a + (b - a) * k;
        const out = { mosaic: cur.mosaic, prevMosaic: prev.mosaic, k };
        ["top", "bot", "ray"].forEach((c) => (out[c] = prev[c].map((v, j) => mix(v, cur[c][j]))));
        KEYS.forEach((p) => (out[p] = mix(prev[p], cur[p])));
        return out;
      }
      const $ = (id) => document.getElementById(id);
      const mosaics = {}; document.querySelectorAll(".mosaic").forEach((m) => (mosaics[m.dataset.key] = m));
      const rows = [...document.querySelectorAll(".mrow")];
      const E = SH.energy;

      function renderAt(time) {
        const t = SH.start + time;
        const ph = phaseAt(t);
        const p = sectionParams(t);
        // Energía del audio (en la cola se reutiliza el último tramo).
        let ft = t <= SH.songEnd ? t : SH.songEnd - 16 + ((t - SH.songEnd) % 16);
        const f = Math.min(E.low.length - 1, Math.max(0, Math.round(ft * E.fps)));
        U.uTime.value = t; U.uPhase.value = ph;
        U.uTop.value.set(...p.top); U.uBot.value.set(...p.bot); U.uRay.value.set(...p.ray);
        U.uStars.value = p.stars; U.uRays.value = p.rays; U.uBlocks.value = p.blocks; U.uSpots.value = p.spots;
        U.uSun.value = p.sun; U.uMist.value = p.mist; U.uSpeed.value = p.speed;
        U.uLo.value = E.low[f]; U.uHi.value = E.high[f]; U.uFrame.value = Math.round(t * 30);
        let burst = -1; SH.bursts.forEach((b) => { if (t >= b && t - b < 3) burst = t - b; });
        U.uBurst.value = burst;
        renderer.render(scene, camera);

        // Mosaico: el de la sección actual entra, el anterior sale.
        Object.entries(mosaics).forEach(([key, el]) => {
          let o = 0;
          if (key === p.mosaic) o = p.k * 0.55;
          else if (key === p.prevMosaic) o = (1 - p.k) * 0.55;
          el.style.opacity = o.toFixed(3);
          el.style.transform = "rotate(-8deg) scale(" + (1.04 + 0.03 * Math.sin(ph * Math.PI / 8)).toFixed(4) + ")";
        });
        rows.forEach((el, i) => { const dir = i % 2 ? 1 : -1; const x = ((t * 46 * dir) % 1400 + 1400) % 1400; el.style.transform = "translateX(" + (-x).toFixed(1) + "px)"; });

        // Pistas de opacidad.
        Object.entries(SH.tracks).forEach(([id, keys]) => { const el = $(id); if (el) el.style.opacity = track(keys, t)[0].toFixed(3); });
        const beatK = 0.5 + 0.5 * Math.cos(2 * Math.PI * ph);   // 1 en cada beat
        // Fotos: leve latido y deriva.
        ["ph-profile", "ph-stage-l", "ph-stage-r", "ph-stage-c"].forEach((id, i) => {
          $(id).style.transform = "translateY(" + (Math.sin(t * 0.6 + i) * 10).toFixed(1) + "px) scale(" + (1 + 0.018 * beatK).toFixed(4) + ")";
        });
        // Corazón.
        const [sep, rot, sat, alpha, sc] = track(SH.heart, t);
        const hw = $("heart-wrap");
        hw.style.opacity = alpha.toFixed(3);
        hw.style.filter = "saturate(" + sat.toFixed(3) + ")";
        hw.style.transformOrigin = "960px 650px";
        hw.style.transform = "rotate(" + (1.5 * Math.sin(ph * Math.PI / 8)).toFixed(3) + "deg) scale(" + (sc * (1 + 0.055 * beatK)).toFixed(4) + ")";
        $("half-l").style.transform = "translateX(" + (-sep).toFixed(1) + "px) rotate(" + (-rot).toFixed(2) + "deg)";
        $("half-r").style.transform = "translateX(" + sep.toFixed(1) + "px) rotate(" + rot.toFixed(2) + "deg)";
        $("ring").style.transform = "rotate(" + (ph * 90).toFixed(2) + "deg)";
        document.querySelectorAll(".neon-star").forEach((el, i) => {
          el.style.transform = "rotate(" + (ph * 22.5 + i * 30).toFixed(2) + "deg) scale(" + (1 + 0.12 * beatK).toFixed(4) + ")";
        });
        $("moon-sun").style.transform = "translateY(" + (Math.sin(ph * Math.PI / 2) * 8).toFixed(1) + "px)";
        // Estrella fugaz.
        const [s0, sd] = SH.shootingStar, u = (t - s0) / sd, sh = $("shoot");
        if (u >= 0 && u <= 1) { const e = ss(u); sh.style.opacity = (Math.sin(Math.PI * u)).toFixed(3);
          sh.style.transform = "translate(" + (-400 + e * 2100).toFixed(1) + "px," + (80 + e * 260).toFixed(1) + "px) rotate(10deg)"; }
        else sh.style.opacity = "0";
        // Logo grande: latido suave.
        $("logo-big").style.transform = "scale(" + (1 + 0.025 * beatK).toFixed(4) + ")";
        $("logo-c").style.transformOrigin = "960px 560px";
        $("logo-c").style.transform = "scale(" + (1 + 0.04 * beatK).toFixed(4) + ")";
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
